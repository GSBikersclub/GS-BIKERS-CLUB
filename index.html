<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Bikers Club - B2B Dealer Portal</title>
    <!-- SheetJS for direct Excel .xlsx reading -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card:hover { transform: translateY(-3px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- Top Navigation -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 p-2 rounded-lg text-white font-black tracking-wider text-xl">GS</div>
                <span class="text-xl font-bold tracking-tight text-white">BIKERS CLUB <span class="text-red-500 text-xs uppercase px-2 py-0.5 bg-red-950 border border-red-800 rounded ml-2">Dealer Portal</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="openCart()" class="relative bg-gray-800 hover:bg-gray-700 p-2.5 rounded-xl border border-gray-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-cart-shopping text-red-500"></i>
                    <span class="text-sm font-medium hidden sm:inline">Order Cart</span>
                    <span id="cart-badge" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filters -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="w-full md:w-96 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search by item name or safety spec..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-red-500 transition">
            </div>
            <!-- Category Tabs -->
            <div id="category-tabs" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end">
                <button onclick="setCategory('All')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-red-600 text-white transition">All Products</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="loading-state" class="text-center py-20 text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500 mb-3"></i>
            <p>Loading catalog directly from gs_bikers_catalog.xlsx...</p>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Dynamically injected via SheetJS -->
        </div>

    </div>

    <!-- Cart Slide-over / Modal -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-gray-900 w-full max-w-md h-full flex flex-col border-l border-gray-800 p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-4 border-b border-gray-800">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-clipboard-list text-red-500"></i>
                    <span>Wholesale Order Summary</span>
                </h2>
                <button onclick="closeCart()" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-4 divide-y divide-gray-800/50">
                <p class="text-gray-500 text-center py-10">Your cart is empty</p>
            </div>
            <div class="pt-4 border-t border-gray-800">
                <div class="flex justify-between items-center mb-4 text-lg font-bold">
                    <span>Total Dealer Cost:</span>
                    <span id="cart-total" class="text-red-500">$0.00</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/20">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Submit Order via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let PRODUCTS = [];
        let cart = {};
        let activeCategory = 'All';

        // Fetch and parse the .xlsx file directly when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('gs_bikers_catalog.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // Read the first sheet
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert sheet to JSON rows
                const rawData = XLSX.utils.sheet_to_json(worksheet);

                PRODUCTS = rawData.map(item => ({
                    id: String(item.id || ''),
                    name: String(item.name || ''),
                    category: String(item.category || ''),
                    safety: String(item.safety || ''),
                    msrp: parseFloat(item.msrp) || 0,
                    dealerPrice: parseFloat(item.dealerPrice) || 0,
                    stock: parseInt(item.stock) || 0,
                    moq: parseInt(item.moq) || 1,
                    image: String(item.image || '')
                }));

                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('product-grid').classList.remove('hidden');
                
                buildCategoryTabs();
                renderProducts();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-state').innerHTML = `<p class="text-red-500 font-bold">Error loading gs_bikers_catalog.xlsx! Make sure your Excel file is uploaded in your GitHub repository root.</p>`;
            }
        });

        function buildCategoryTabs() {
            const categories = ['All', ...new Set(PRODUCTS.map(p => p.category))];
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold transition ${cat === activeCategory ? 'bg-red-600 text-white shadow-lg shadow-red-900/30' : 'bg-gray-900 border border-gray-800 text-gray-300 hover:bg-gray-800'}">${cat}</button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            buildCategoryTabs();
            renderProducts();
        }

        function renderProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('product-grid');

            const filtered = PRODUCTS.filter(p => {
                const matchesCat = activeCategory === 'All' || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.safety.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-500">No products found matching your search.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const currentQty = cart[p.id] || 0;
                return `
                    <div class="product-card bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="relative h-48 bg-gray-950 overflow-hidden">
                                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                                <span class="absolute top-3 left-3 bg-gray-900/90 backdrop-blur border border-gray-700 text-xs px-2.5 py-1 rounded-lg font-semibold text-gray-300">${p.category}</span>
                                <span class="absolute top-3 right-3 bg-red-950/90 border border-red-800 text-xs px-2.5 py-1 rounded-lg font-bold text-red-400">${p.safety}</span>
                            </div>
                            <div class="p-5">
                                <h3 class="font-bold text-lg text-white mb-3 line-clamp-1">${p.name}</h3>
                                <div class="grid grid-cols-2 gap-2 bg-gray-950 p-3 rounded-xl border border-gray-800/60 mb-4 text-sm">
                                    <div>
                                        <span class="text-xs text-gray-500 block">MSRP</span>
                                        <span class="font-semibold text-gray-400 line-through">$${p.msrp.toFixed(2)}</span>
                                    </div>
                                    <div>
                                        <span class="text-xs text-red-400 block font-bold">Dealer Price</span>
                                        <span class="font-black text-red-500 text-base">$${p.dealerPrice.toFixed(2)}</span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center text-xs text-gray-400 mb-2 px-1">
                                    <span>Stock: <strong class="text-gray-200">${p.stock} units</strong></span>
                                    <span>MOQ: <strong class="text-gray-200">${p.moq} pcs</strong></span>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <div class="flex items-center space-x-2">
                                <input type="number" id="qty-${p.id}" min="${p.moq}" value="${currentQty > 0 ? currentQty : p.moq}" 
                                    class="w-20 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-center font-bold text-sm focus:outline-none focus:border-red-500">
                                <button onclick="updateCart('${p.id}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-lg shadow-red-900/20">
                                    <i class="fa-solid fa-cart-plus"></i>
                                    <span>${currentQty > 0 ? 'Update Qty' : 'Add to Order'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterProducts() {
            renderProducts();
        }

        function updateCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            const qtyInput = document.getElementById(`qty-${id}`);
            let qty = parseInt(qtyInput.value) || 0;

            if (qty < product.moq) {
                alert(`Minimum Order Quantity (MOQ) for ${product.name} is ${product.moq} units.`);
                qty = product.moq;
                qtyInput.value = qty;
            }

            if (qty > 0) {
                cart[id] = qty;
            } else {
                delete cart[id];
            }

            updateCartBadge();
            renderProducts();
        }

        function updateCartBadge() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cart-badge').innerText = totalItems;
        }

        function openCart() {
            renderCartModal();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCartModal() {
            const container = document.getElementById('cart-items');
            const entryKeys = Object.keys(cart);

            if (entryKeys.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-10">Your cart is empty</p>`;
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let totalCost = 0;
            container.innerHTML = entryKeys.map(id => {
                const p = PRODUCTS.find(prod => prod.id === id);
                const qty = cart[id];
                const subtotal = p.dealerPrice * qty;
                totalCost += subtotal;

                return `
                    <div class="py-3 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-sm text-white">${p.name}</h4>
                            <span class="text-xs text-gray-400">$${p.dealerPrice.toFixed(2)} × ${qty} pcs</span>
                        </div>
                        <div class="text-right flex items-center space-x-3">
                            <span class="font-bold text-red-500">$${subtotal.toFixed(2)}</span>
                            <button onclick="removeFromCart('${id}')" class="text-gray-500 hover:text-red-400 text-sm"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = '$' + totalCost.toFixed(2);
        }

        function removeFromCart(id) {
            delete cart[id];
            updateCartBadge();
            renderCartModal();
            renderProducts();
        }

        function checkoutWhatsApp() {
            const entryKeys = Object.keys(cart);
            if (entryKeys.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            let message = "Hello, I would like to place a B2B Dealer Order:\n\n";
            let totalCost = 0;

            entryKeys.forEach(id => {
                const p = PRODUCTS.find(prod => prod.id === id);
                const qty = cart[id];
                const subtotal = p.dealerPrice * qty;
                totalCost += subtotal;
                message += `• ${p.name} (ID: ${p.id}) - Qty: ${qty} - Subtotal: $${subtotal.toFixed(2)}\n`;
            });

            message += `\nTotal Order Value: $${totalCost.toFixed(2)}`;
            
            const phone = "1234567890"; 
            window.open(`https://wa.me/${phone}?text=` + encodeURIComponent(message), '_blank');
        }
    </script>
</body>
</html>
